# PID控制器配置文件
# 修改此文件后重启程序即可生效

# 速度控制器参数 (加速度到速度)
speed_controller:
  kp: 5                    # 比例增益
  ki: 0.1                    # 积分增益
  kd: 0.4                    # 微分增益
  max_output: 3.0            # 最大加速度 (m/s^2)
  min_output: -3.0           # 最小加速度 (m/s^2)
  max_integral: 1.0          # 积分限幅

# 大臂角度控制器参数 (阀开度到角度)
arm_controller:
  kp: 130.0                   # 比例增益 - 调整为较大值以提高响应速度
  ki: 1.0                    # 积分增益 - 降低至适中值减少振荡
  kd: 0.0                    # 微分增益
  max_output: 500.0          # 最大阀电流 (mA)
  min_output: -500.0         # 最小阀电流 (mA) - 允许负值表示反向控制
  max_integral: 300.0        # 积分限幅
  deadzone: 0.1              # 死区 (度)

# 铲斗角度控制器参数 (阀开度到角度)
bucket_controller:
  kp: 130.0                   # 比例增益 - 调整为较大值以提高响应速度
  ki: 2.0                    # 积分增益 - 降低至适中值减少振荡
  kd: 0.0                    # 微分增益
  max_output: 500.0          # 最大阀电流 (mA)
  min_output: -500.0         # 最小阀电流 (mA) - 允许负值表示反向控制
  max_integral: 300.0        # 积分限幅
  deadzone: 0.1              # 死区 (度)

# 转向角度控制器参数 (阀开度到角度)
steer_controller:
  kp: 150.0                   # 比例增益 - 调整为较大值以提高响应速度
  ki: 3.0                   # 积分增益 - 降低至适中值减少振荡
  kd: 0.0                    # 微分增益
  max_output: 1200.0          # 最大阀电流 (mA)
  min_output: -1200.0         # 最小阀电流 (mA) - 允许负值表示反向控制
  max_integral: 400.0        # 积分限幅 - 降低防止积分饱和
  deadzone: 0.1              # 死区 (度)

# 零点偏置参数
zero_offsets:
  boom_zero_deg: 144.0      # 大臂零点偏置 (度) - 根据测量：0x582大臂为-144度，0x583车身为-3度，大臂对车身为-141度
  bucket_zero_deg: -56.5      # 铲斗零点偏置 (度) - 根据测量：0x581铲斗为-88度，0x582大臂为-144度，铲斗对大臂为56度
  steer_zero_deg: 0.0        # 转向零点偏置 (度)
