# Autonomy stack defaults (stubs).
loader_perception_node:
  ros__parameters:
    publish_rate_hz: 5.0

loader_localization_node:
  ros__parameters:
    publish_rate_hz: 20.0
    frame_id: map
    child_frame_id: base_link

loader_mission_node:
  ros__parameters:
    publish_rate_hz: 5.0
    auto_advance_stub: false

loader_planning_node:
  ros__parameters:
    publish_rate_hz: 10.0

loader_control_node:
  ros__parameters:
    publish_rate_hz: 20.0
    # Keep false until ControlCommand protobuf → /vehicle_command is implemented.
    enable_vehicle_command: false
    default_mode: auto
