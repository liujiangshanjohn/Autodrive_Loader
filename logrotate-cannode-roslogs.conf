# logrotate 规则：轮转 cannode_ws 的 ROS_LOG_DIR 日志
# 目标：当文件 >100MB 时自动分割（轮转），并保留少量历史、压缩。
#
# 适用范围：
# - ROS2 自己在 ROS_LOG_DIR 下生成的 *.log（例如 bucket_open_lidar_tracker_*.log 等）
# - 我们脚本新增的 stdout/*.log
#
# 注意：copytruncate 适合“进程一直写同一个文件”的场景。
# 对于 ROS2 每次启动新文件的场景，它也没坏处（只是轮转机制用不上那么频繁）。

/media/nvidia/00code/cannode_ws/log/*.log
/media/nvidia/00code/cannode_ws/log/**/*.log
/media/nvidia/00code/cannode_ws/log/stdout/*.log
{
    size 100M
    rotate 5
    compress
    delaycompress
    missingok
    notifempty
    copytruncate
    dateext
    dateformat -%Y%m%d-%H%M%S
}

